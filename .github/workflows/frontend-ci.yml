name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["project/frontend/**"]
  pull_request:
    paths: ["project/frontend/**"]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/frontend
    env:
      BACKEND_API_URL: http://localhost:3001
      SITE_URL: http://localhost:3000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm exec prettier --check "src/**/*.{ts,tsx}"
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true
      - name: Build
        run: pnpm build
